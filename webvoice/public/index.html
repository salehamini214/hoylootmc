
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOYLOTT Voice Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: #090d18;
      color: #f4f7ff;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 520px;
      background: #121a2b;
      border: 1px solid #293653;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 70px #0008;
    }
    h1 { text-align: center; margin: 0; color: #67a5ff; }
    .subtitle { text-align: center; color: #a9b7d0; margin: 10px 0 25px; }
    label { display: block; margin: 14px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #34435f;
      background: #0b1120;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary { width: 100%; margin-top: 12px; background: #3478f6; color: white; }
    .secondary { background: #263550; color: white; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin: 18px 0;
      padding: 12px;
      border-radius: 10px;
      background: #0b1120;
      color: #b8c8e6;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .members { margin-top: 20px; }
    .member {
      background: #1b2740;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .controls { display: flex; gap: 10px; margin-top: 15px; }
    .controls button { flex: 1; }
    .hidden { display: none; }
    .small { color: #9eacc5; font-size: 12px; line-height: 1.8; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🎙 HOYLOTT</h1>
    <p class="subtitle">چت صوتی گروهی بازیکنان ماینکرفت</p>

    <section id="entry">
      <label for="nickname">اسم شما</label>
      <input id="nickname" maxlength="20" placeholder="مثلاً Saleh">

      <label for="room">کد اتاق (برای ورود به گروه)</label>
      <input id="room" maxlength="20" placeholder="کد گروه را وارد کن">

      <button class="primary" id="join">ورود به گروه</button>
      <button class="primary" id="create">ساخت گروه جدید</button>

      <p class="small">
        برای صحبت با دوستان، همه باید وارد همین صفحه شوند و کد یکسانی وارد کنند.
        اجازه استفاده از میکروفون را به مرورگر بدهید.
      </p>
    </section>

    <section id="chat" class="hidden">
      <div class="status" id="status">در حال اتصال...</div>
      <div><b>کد گروه:</b> <span id="roomCode"></span></div>

      <div class="controls">
        <button class="secondary" id="mute">🎙 قطع میکروفون</button>
        <button class="secondary" id="leave">خروج از گروه</button>
      </div>

      <div class="members">
        <b>اعضای گروه</b>
        <div id="members"></div>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    let socket = null;
    let localStream = null;
    let roomCode = "";
    let myId = "";
    let muted = false;
    let peers = {};
    let memberNames = {};

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
      ]
    };

    function setStatus(text) {
      $("status").textContent = text;
    }

    function makeRoomCode() {
      return Math.random().toString(36).slice(2, 8).toUpperCase();
    }

    $("create").onclick = () => {
      $("room").value = makeRoomCode();
      joinRoom(true);
    };

    $("join").onclick = () => joinRoom(false);

    async function joinRoom(createNew) {
      const nickname = $("nickname").value.trim();
      roomCode = $("room").value.trim().toUpperCase();

      if (!nickname) {
        alert("اول اسمت را وارد کن.");
        return;
      }

      if (!roomCode) {
        alert("کد گروه را وارد کن یا گروه جدید بساز.");
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("برای استفاده از میکروفون باید سایت روی HTTPS باز شود.");
        return;
      }

      $("join").disabled = true;
      $("create").disabled = true;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });

        socket = io();

        socket.on("connect", () => {
          myId = socket.id;
          socket.emit("join-room", {
            room: roomCode,
            name: nickname,
            create: createNew
          });
        });

        socket.on("room-joined", data => {
          $("entry").classList.add("hidden");
          $("chat").classList.remove("hidden");
          $("roomCode").textContent = roomCode;
          setStatus("به گروه متصل شدی؛ منتظر اتصال صوتی اعضا...");
          memberNames = data.members || {};
          renderMembers();
        });

        socket.on("user-joined", async data => {
          memberNames[data.id] = data.name;
          renderMembers();
          await createPeer(data.id, true);
        });

        socket.on("user-left", id => {
          if (peers[id]) {
            peers[id].close();
            delete peers[id];
          }
          delete memberNames[id];
          renderMembers();
        });

        socket.on("signal", async data => {
          let pc = peers[data.from];
          if (!pc) pc = await createPeer(data.from, false);

          try {
            if (data.signal.description) {
              await pc.setRemoteDescription(data.signal.description);

              if (data.signal.description.type === "offer") {
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit("signal", {
                  to: data.from,
                  signal: { description: pc.localDescription }
                });
              }
            } else if (data.signal.candidate) {
              await pc.addIceCandidate(data.signal.candidate);
            }
          } catch (err) {
            console.error("Signal error:", err);
          }
        });

        socket.on("connect_error", () => {
          setStatus("اتصال ناموفق؛ سرور را بررسی کن.");
        });

        socket.on("room-error", message => {
          alert(message || "ورود به گروه ناموفق بود.");
          cleanup();
        });

      } catch (err) {
        alert("دسترسی میکروفون داده نشد یا مرورگر اجازه استفاده نداد.");
        cleanup();
      }
    }

    async function createPeer(peerId, offerer) {
      if (peers[peerId]) return peers[peerId];

      const pc = new RTCPeerConnection(rtcConfig);
      peers[peerId] = pc;

      localStream.getTracks().forEach(track => {
        pc.addTrack(track, localStream);
      });

      pc.onicecandidate = event => {
        if (event.candidate && socket) {
          socket.emit("signal", {
            to: peerId,
            signal: { candidate: event.candidate }
          });
        }
      };

      pc.ontrack = event => {
        let audio = document.getElementById("audio-" + peerId);
        if (!audio) {
          audio = document.createElement("audio");
          audio.id = "audio-" + peerId;
          audio.autoplay = true;
          audio.playsInline = true;
          document.body.appendChild(audio);
        }
        audio.srcObject = event.streams[0];
        audio.play().catch(() => {
          setStatus("برای شنیدن صدا، یک بار روی صفحه کلیک کن.");
        });
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "connected") {
          setStatus("اتصال صوتی برقرار است.");
        }
      };

      if (offerer) {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit("signal", {
          to: peerId,
          signal: { description: pc.localDescription }
        });
      }

      return pc;
    }

    function renderMembers() {
      const box = $("members");
      box.replaceChildren();

      Object.entries(memberNames).forEach(([id, name]) => {
        const item = document.createElement("div");
        item.className = "member";
        const label = document.createElement("span");
        label.textContent = name + (id === myId ? " (شما)" : "");
        const state = document.createElement("span");
        state.textContent = id === myId && muted ? "🔇" : "🎙";
        item.append(label, state);
        box.appendChild(item);
      });
    }

    $("mute").onclick = () => {
      if (!localStream) return;
      muted = !muted;
      localStream.getAudioTracks().forEach(track => track.enabled = !muted);
      $("mute").textContent = muted ? "🔇 روشن کردن میکروفون" : "🎙 قطع میکروفون";
      renderMembers();
    };

    $("leave").onclick = cleanup;

    function cleanup() {
      Object.values(peers).forEach(pc => pc.close());
      peers = {};

      document.querySelectorAll("audio[id^='audio-']").forEach(a => {
        a.srcObject = null;
        a.remove();
      });

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      if (socket) {
        socket.disconnect();
        socket = null;
      }

      memberNames = {};
      muted = false;
      $("chat").classList.add("hidden");
      $("entry").classList.remove("hidden");
      $("join").disabled = false;
      $("create").disabled = false;
      $("mute").textContent = "🎙 قطع میکروفون";
    }
  </script>
</body>
</html>
