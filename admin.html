
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت | HOYLOTT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">💎 HOYLOTT Admin</a>
    <a href="index.html">مشاهده سایت</a>
  </header>

  <main class="admin-wrap">
    <h1>پنل مدیریت سایت</h1>
    <p>برای ویرایش سایت، با حساب مدیر وارد شو.</p>
    <p id="admin-status" class="admin-status" aria-live="polite"></p>

    <section class="admin-panel" id="login-panel">
      <h2>ورود مدیر</h2>
      <form id="login-form">
        <label for="email">ایمیل مدیر</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">رمز عبور</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="btn primary" type="submit">ورود</button>
      </form>
    </section>

    <div id="admin-content" hidden>
      <section class="admin-panel">
        <h2>تنظیمات صفحه اصلی</h2>
        <form id="settings-form">
          <label for="site-title">عنوان اصلی</label>
          <input id="site-title" required>
          <label for="site-description">توضیحات اصلی</label>
          <textarea id="site-description" rows="3"></textarea>
          <label for="server-address-input">آدرس سرور</label>
          <input id="server-address-input">
          <button class="btn primary" type="submit">ذخیره تنظیمات</button>
        </form>
      </section>

      <section class="admin-panel">
        <h2>محصولات و قیمت‌ها</h2>
        <form id="products-form">
          <div id="product-fields"></div>
          <button class="btn primary" type="submit">ذخیره قیمت‌ها</button>
        </form>
      </section>

      <section class="admin-panel">
        <h2>افزودن خبر</h2>
        <form id="news-form">
          <label for="news-title">عنوان خبر</label>
          <input id="news-title" required>
          <label for="news-body">متن خبر</label>
          <textarea id="news-body" rows="4" required></textarea>
          <label for="news-image">تصویر خبر</label>
          <input id="news-image" type="file" accept="image/png,image/jpeg,image/webp">
          <label>
            <input id="news-published" type="checkbox" checked style="width:auto">
            انتشار خبر روی سایت
          </label>
          <button class="btn primary" type="submit">ثبت خبر</button>
        </form>
        <h3>اخبار قبلی</h3>
        <div id="admin-news-list"></div>
      </section>

      <button id="logout-button" class="btn secondary" type="button">خروج از حساب</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
