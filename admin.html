
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت HOYLOTT</title>
<link rel="stylesheet" href="style.css">
<style>
.admin {
  width: min(650px, 92%);
  margin: 50px auto;
}
input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 16px;
  border-radius: 10px;
  border: 1px solid #293b5b;
  background: #0b1425;
  color: white;
  font: inherit;
}
label { display: block; }
</style>
</head>
<body>
<div class="admin">
  <h1>مدیریت سایت HOYLOTT</h1>

  <section class="card" id="login">
    <h2>ورود مدیر</h2>
    <label for="password">رمز عبور</label>
    <input id="password" type="password" placeholder="رمز مدیریت">
    <button class="button" onclick="login()">ورود</button>
    <p id="error"></p>
  </section>

  <section class="card" id="editor" hidden>
    <h2>ویرایش قیمت‌ها</h2>

    <label for="vip">قیمت VIP سی‌روزه</label>
    <input id="vip" value="۱۱۰٬۰۰۰ تومان">

    <label for="coin10">قیمت ۱۰٬۰۰۰ سکه</label>
    <input id="coin10" value="۲۰٬۰۰۰ تومان">

    <label for="coin30">قیمت ۳۰٬۰۰۰ سکه</label>
    <input id="coin30" value="۶۰٬۰۰۰ تومان">

    <button class="button" onclick="downloadPrices()">دانلود قیمت‌ها</button>
    <p>فایل دانلودشده را برای به‌روزرسانی قیمت‌ها در سایت اعمال کن.</p>
  </section>
</div>

<script>
/*
  نمونه محلی בלבד؛ این رمز امنیت واقعی ایجاد نمی‌کند.
  برای سایت عمومی از احراز هویت سمت سرور استفاده کن.
*/
const ADMIN_PASSWORD = "@s05831396S";

function login() {
  if (document.getElementById("password").value === ADMIN_PASSWORD) {
    document.getElementById("login").hidden = true;
    document.getElementById("editor").hidden = false;
  } else {
    document.getElementById("error").textContent = "رمز اشتباه است.";
  }
}

function downloadPrices() {
  const prices = {
    vip: document.getElementById("vip").value,
    coin10: document.getElementById("coin10").value,
    coin30: document.getElementById("coin30").value
  };

  const blob = new Blob(
    [JSON.stringify(prices, null, 2)],
    { type: "application/json;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "prices.json";
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
